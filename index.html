<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>wMetax ai</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:#050507;
  color:#f4f4f6;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}

body{overflow:hidden}

.app{
  height:100dvh;
  max-width:900px;
  margin:auto;
  display:flex;
  flex-direction:column
}

.top{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 16px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px
}

.brand img{
  width:36px;
  height:36px;
  border-radius:10px;
  object-fit:cover
}

.logo{
  font-size:25px;
  font-weight:750
}

.logo span{
  font-weight:450;
  color:#8d8e96
}

.actions{
  margin-left:auto;
  display:flex;
  gap:5px
}

.icon{
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  background:#15161b;
  color:#ddd;
  font-size:20px;
  cursor:pointer
}

.modelbar{
  display:flex;
  justify-content:center;
  padding:2px 16px 8px
}

.model{
  position:relative
}

.model>button{
  border:0;
  background:#17181d;
  color:#eee;
  border-radius:14px;
  padding:10px 15px;
  font-size:15px;
  min-width:140px
}

.menu{
  position:absolute;
  top:48px;
  left:50%;
  transform:translateX(-50%);
  width:235px;
  background:#17181d;
  border:1px solid #292a31;
  border-radius:16px;
  padding:7px;
  z-index:20;
  box-shadow:0 18px 50px #0009
}

.hidden{
  display:none!important
}

.item{
  padding:11px 12px;
  border-radius:11px;
  cursor:pointer;
  display:flex;
  justify-content:space-between
}

.item:hover{
  background:#24252b
}

.item small{
  color:#85858d
}

.messages{
  flex:1;
  overflow:auto;
  padding:10px 16px 120px;
  display:flex;
  flex-direction:column;
  gap:10px
}

.empty{
  margin:auto;
  text-align:center;
  color:#8c8d95
}

.empty b{
  display:block;
  color:#eee;
  font-size:28px;
  margin-bottom:8px
}

.bubble{
  max-width:82%;
  padding:12px 14px;
  border-radius:17px;
  line-height:1.6;
  font-size:15px;
  white-space:pre-wrap
}

.user{
  align-self:flex-end;
  background:#2a2c34
}

.ai{
  align-self:flex-start;
  background:#15161b
}

.composer{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:min(900px,100%);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,#050507 25%);
  display:flex;
  gap:8px
}

.input{
  flex:1;
  min-height:52px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  border-radius:18px;
  background:#17181d;
  color:#fff;
  padding:15px;
  font:inherit
}

.send{
  width:52px;
  height:52px;
  border:0;
  border-radius:17px;
  background:#f1f1f3;
  color:#08080a;
  font-size:22px
}

.drawer,
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50
}

.panel{
  height:100%;
  width:min(350px,88%);
  background:#101116;
  padding:20px;
  box-shadow:20px 0 60px #0008;
  overflow:auto
}

.modal .panel{
  height:auto;
  max-height:80%;
  margin:10vh auto;
  border-radius:20px;
  width:min(430px,90%)
}

.close{
  float:right
}

.chatrow{
  padding:12px;
  border-radius:12px;
  background:#18191f;
  margin-bottom:8px;
  display:flex;
  gap:8px;
  align-items:center
}

.chatrow button{
  background:none;
  border:0;
  color:#bbb;
  cursor:pointer;
  font-size:18px
}

.chatname{
  flex:1;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.memory{
  padding:12px;
  border-radius:12px;
  background:#18191f;
  margin:8px 0
}

.memory button{
  float:right;
  background:none;
  border:0;
  color:#aaa;
  cursor:pointer
}

.addmem{
  display:flex;
  gap:8px;
  margin-top:12px
}

.addmem input{
  flex:1;
  background:#18191f;
  color:#fff;
  border:1px solid #292a31;
  border-radius:10px;
  padding:10px
}

.addmem button{
  border:0;
  border-radius:10px;
  padding:10px 12px
}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="brand">
<img src="./assets/wmetax_logo.png" alt="wMetax ai">

<div class="logo">
wMetax <span>ai</span>
</div>
</div>

<div class="actions">

<button class="icon" id="chats">
☰
</button>

<button class="icon" id="settings">
⚙
</button>

</div>

</header>


<div class="modelbar">

<div class="model">

<button id="modelBtn">
Auto ⌄
</button>

<div class="menu hidden" id="modelMenu"></div>

</div>

</div>


<main class="messages" id="messages">

<div class="empty">
<b>wMetax ai</b>
Ask anything.
</div>

</main>


<div class="composer">

<textarea
id="input"
class="input"
rows="1"
placeholder="Ask anything…"
></textarea>

<button
id="send"
class="send">
➤
</button>

</div>

</div>


<!-- CHAT DRAWER -->

<div class="drawer hidden" id="drawer">

<div class="panel">

<button class="icon close" id="closeDrawer">
×
</button>

<h2>Chats</h2>

<div class="item" id="newChat">
＋ New chat
</div>

<div id="chatList"></div>

</div>

</div>


<!-- MEMORY -->

<div class="modal hidden" id="modal">

<div class="panel">

<button class="icon close" id="closeModal">
×
</button>

<h2>Memory</h2>

<p style="color:#888">
Saved memories are stored on this device.
</p>

<div id="memoryList"></div>

<div class="addmem">

<input
id="memoryInput"
placeholder="Add a memory…"
>

<button id="addMemory">
Save
</button>

</div>

</div>

</div>


<script>

const MODELS=[
"Auto",
"ChatGPT",
"Claude",
"Grok",
"Gemini",
"DeepSeek",
"Perplexity"
];

let selectedModel=
localStorage.getItem("wmetax_model")||"Auto";

let chats=
JSON.parse(
localStorage.getItem("wmetax_chats")||"[]"
);

let memories=
JSON.parse(
localStorage.getItem("wmetax_memories")||"[]"
);

let currentId=
localStorage.getItem("wmetax_current")||null;


const $=id=>
document.getElementById(id);


/* CURRENT CHAT */

function currentChat(){

return chats.find(
chat=>chat.id===currentId
);

}


/* SAVE */

function save(){

localStorage.setItem(
"wmetax_chats",
JSON.stringify(chats)
);

localStorage.setItem(
"wmetax_memories",
JSON.stringify(memories)
);

if(currentId){

localStorage.setItem(
"wmetax_current",
currentId
);

}

}


/* CREATE CHAT */

function ensureChat(){

if(!currentChat()){

currentId=
crypto.randomUUID();

chats.unshift({

id:currentId,

title:"New chat",

pinned:false,

messages:[]

});

save();

}

}


/* RENDER CHAT */

function render(){

const chat=currentChat();

const box=$("messages");

box.innerHTML="";

if(
!chat ||
chat.messages.length===0
){

box.innerHTML=`
<div class="empty">
<b>wMetax ai</b>
Ask anything.
</div>
`;

return;

}


chat.messages.forEach(message=>{

const bubble=
document.createElement("div");

bubble.className=
"bubble "+
(
message.role==="user"
?"user"
:"ai"
);

bubble.textContent=
message.content;

box.appendChild(bubble);

});

box.scrollTop=
box.scrollHeight;

}


/* CHAT LIST */

function renderChats(){

const box=$("chatList");

box.innerHTML="";

const ordered=
[...chats].sort(
(a,b)=>
Number(b.pinned)-
Number(a.pinned)
);


ordered.forEach(chat=>{

const row=
document.createElement("div");

row.className="chatrow";


const name=
document.createElement("div");

name.className="chatname";

name.textContent=
(chat.pinned?"📌 ":"")+
chat.title;

name.onclick=()=>{

currentId=chat.id;

save();

render();

renderChats();

$("drawer")
.classList.add("hidden");

};


const pin=
document.createElement("button");

pin.textContent=
chat.pinned?"📌":"📍";

pin.onclick=()=>{

chat.pinned=
!chat.pinned;

save();

renderChats();

};


const del=
document.createElement("button");

del.textContent="×";

del.onclick=()=>{

chats=
chats.filter(
x=>x.id!==chat.id
);

if(
currentId===chat.id
){

currentId=
chats[0]?.id||null;

}

save();

render();

renderChats();

};


row.appendChild(name);

row.appendChild(pin);

row.appendChild(del);

box.appendChild(row);

});

}


/* MEMORY LIST */

function renderMemories(){

const box=$("memoryList");

box.innerHTML="";

memories.forEach(
(memory,index)=>{

const item=
document.createElement("div");

item.className="memory";

item.textContent=
memory;


const del=
document.createElement("button");

del.textContent="×";

del.onclick=()=>{

memories.splice(index,1);

save();

renderMemories();

};

item.appendChild(del);

box.appendChild(item);

});

}


/* MODEL MENU */

MODELS.forEach(model=>{

const item=
document.createElement("div");

item.className="item";

item.innerHTML=`
<span>${model}</span>
<small>
${
model==="Auto"
?"Best model"
:"Available"
}
</small>
`;

item.onclick=()=>{

selectedModel=model;

localStorage.setItem(
"wmetax_model",
model
);

$("modelBtn").textContent=
model+" ⌄";

$("modelMenu")
.classList.add("hidden");

};

$("modelMenu")
.appendChild(item);

});


$("modelBtn").textContent=
selectedModel+" ⌄";


$("modelBtn").onclick=()=>{

$("modelMenu")
.classList.toggle("hidden");

};


/* CHAT BUTTON */

$("chats").onclick=()=>{

$("drawer")
.classList.remove("hidden");

renderChats();

};


/* CLOSE CHAT */

$("closeDrawer").onclick=()=>{

$("drawer")
.classList.add("hidden");

};


/* NEW CHAT */

$("newChat").onclick=()=>{

currentId=
crypto.randomUUID();

chats.unshift({

id:currentId,

title:"New chat",

pinned:false,

messages:[]

});

save();

render();

renderChats();

$("drawer")
.classList.add("hidden");

};


/* MEMORY */

$("settings").onclick=()=>{

$("modal")
.classList.remove("hidden");

renderMemories();

};


$("closeModal").onclick=()=>{

$("modal")
.classList.add("hidden");

};


/* ADD MEMORY */

$("addMemory").onclick=()=>{

const value=
$("memoryInput")
.value
.trim();

if(!value)return;

memories.push(value);

$("memoryInput").value="";

save();

renderMemories();

};


/* SEND */

async function send(){

const input=$("input");

const text=
input.value.trim();

if(!text)return;

ensureChat();

const chat=currentChat();


chat.messages.push({

role:"user",

content:text

});


if(
chat.title==="New chat"
){

chat.title=
text.slice(0,40);

}

input.value="";

render();

save();


/*
AI PROVIDER CONNECTION
WILL BE ADDED HERE.
*/

await new Promise(
resolve=>
setTimeout(resolve,400)
);


chat.messages.push({

role:"assistant",

content:
"Your message has been saved.\n\n"+
"Model: "+
selectedModel+
"\n\n"+
"AI provider connection is the next step."

});

render();

save();

}


/* SEND BUTTON */

$("send").onclick=send;


/* ENTER */

$("input")
.addEventListener(
"keydown",
event=>{

if(
event.key==="Enter" &&
!event.shiftKey
){

event.preventDefault();

send();

}

});


/* INITIALIZE */

ensureChat();

render();

</script>

</body>
</html>
