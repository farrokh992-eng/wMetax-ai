<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>wMetax ai</title>

<style>
*{box-sizing:border-box}
html,body{
margin:0;height:100%;background:#050507;color:#f4f4f6;
font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}
body{overflow:hidden}
button,input,textarea{font:inherit}

.app{
height:100dvh;max-width:900px;margin:auto;
display:flex;flex-direction:column
}

.top{
height:62px;display:flex;align-items:center;padding:0 16px
}

.brand{display:flex;align-items:center;gap:10px}

.brand img{
width:36px;height:36px;border-radius:10px;object-fit:cover
}

.logo{font-size:25px;font-weight:750}
.logo span{font-weight:450;color:#8d8e96}

.actions{
margin-left:auto;display:flex;gap:5px
}

.icon{
width:40px;height:40px;border:0;border-radius:13px;
background:#15161b;color:#ddd;font-size:20px;cursor:pointer
}

.modelbar{
display:flex;justify-content:center;padding:2px 16px 8px
}

.model{position:relative}

.model>button{
border:0;background:#17181d;color:#eee;border-radius:14px;
padding:10px 15px;font-size:15px;min-width:165px;cursor:pointer
}

.menu{
position:absolute;top:48px;left:50%;transform:translateX(-50%);
width:260px;background:#17181d;border:1px solid #292a31;
border-radius:16px;padding:7px;z-index:30;
box-shadow:0 18px 50px #0009
}

.hidden{display:none!important}

.item{
padding:11px 12px;border-radius:11px;cursor:pointer;
display:flex;justify-content:space-between
}

.item:hover{background:#24252b}
.item small{color:#85858d}

.messages{
flex:1;overflow:auto;padding:10px 16px 120px;
display:flex;flex-direction:column;gap:10px
}

.empty{
margin:auto;text-align:center;color:#8c8d95
}

.empty b{
display:block;color:#eee;font-size:28px;margin-bottom:8px
}

.bubble{
max-width:82%;padding:12px 14px;border-radius:17px;
line-height:1.6;font-size:15px;white-space:pre-wrap;
overflow-wrap:anywhere
}

.user{align-self:flex-end;background:#2a2c34}
.ai{align-self:flex-start;background:#15161b}
.typing{opacity:.65}

.composer{
position:fixed;left:50%;transform:translateX(-50%);
bottom:0;width:min(900px,100%);
padding:10px 16px calc(10px + env(safe-area-inset-bottom));
background:linear-gradient(transparent,#050507 25%);
display:flex;gap:8px
}

.input{
flex:1;min-height:52px;max-height:140px;resize:none;border:0;
outline:0;border-radius:18px;background:#17181d;color:#fff;
padding:15px
}

.send{
width:52px;height:52px;border:0;border-radius:17px;
background:#f1f1f3;color:#08080a;font-size:22px;cursor:pointer
}

.send:disabled{opacity:.5;cursor:default}

.drawer,.modal{
position:fixed;inset:0;background:#0008;z-index:50
}

.panel{
height:100%;width:min(350px,88%);background:#101116;
padding:20px;box-shadow:20px 0 60px #0008;overflow:auto
}

.modal .panel{
height:auto;max-height:85%;margin:8vh auto;border-radius:20px;
width:min(440px,92%)
}

.close{float:right}

.chatrow{
padding:12px;border-radius:12px;background:#18191f;
margin-bottom:8px;display:flex;gap:8px;align-items:center
}

.chatrow button{
background:none;border:0;color:#bbb;cursor:pointer;font-size:18px
}

.chatname{
flex:1;cursor:pointer;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap
}

.memory{
padding:12px;border-radius:12px;background:#18191f;margin:8px 0
}

.memory button{
float:right;background:none;border:0;color:#aaa;cursor:pointer
}

.addmem{
display:flex;gap:8px;margin-top:12px
}

.addmem input{
flex:1;background:#18191f;color:#fff;border:1px solid #292a31;
border-radius:10px;padding:10px
}

.addmem button,.primary{
border:0;border-radius:10px;padding:10px 14px;cursor:pointer
}

.field{margin:18px 0}

.field label{
display:block;color:#aaa;font-size:13px;margin-bottom:7px
}

.field input{
width:100%;background:#18191f;color:#fff;
border:1px solid #292a31;border-radius:11px;
padding:12px;outline:none
}

.help{
color:#777;font-size:12px;line-height:1.6
}

.status{
min-height:18px;margin-top:8px;font-size:12px;line-height:1.5
}

.danger{background:#2a1719;color:#ffb5b8}
.success{color:#9ee6ae}
.error{color:#ff9da3}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="brand">
<img src="./assets/wmetax_logo.png" alt="wMetax ai">
<div class="logo">wMetax <span>ai</span></div>
</div>

<div class="actions">
<button class="icon" id="chats" title="Chats">☰</button>
<button class="icon" id="settings" title="Settings">⚙</button>
</div>

</header>

<div class="modelbar">

<div class="model">

<button id="modelBtn">Auto ⌄</button>

<div class="menu hidden" id="modelMenu"></div>

</div>

</div>

<main class="messages" id="messages"></main>

<div class="composer">

<textarea
id="input"
class="input"
rows="1"
placeholder="Ask anything…"
autocomplete="off"
></textarea>

<button id="send" class="send">➤</button>

</div>

</div>


<!-- CHATS -->

<div class="drawer hidden" id="drawer">

<div class="panel">

<button class="icon close" id="closeDrawer">×</button>

<h2>Chats</h2>

<div class="item" id="newChat">
＋ New chat
</div>

<div id="chatList"></div>

</div>

</div>


<!-- SETTINGS -->

<div class="modal hidden" id="modal">

<div class="panel">

<button class="icon close" id="closeModal">×</button>

<h2>Settings</h2>

<div class="field">

<label>Gemini API Key</label>

<input
id="apiKey"
type="password"
placeholder="Enter Gemini API Key"
autocomplete="off"
>

</div>

<button class="primary" id="saveKey">
Save API Key
</button>

<button class="primary danger" id="removeKey">
Remove API Key
</button>

<p class="help">
The API key is stored only in this browser's local storage.
This is suitable for a private demo, not a public production app.
</p>

<hr style="border-color:#24252b;margin:22px 0">

<h3>Memory</h3>

<p class="help">
Memories are stored locally and sent as context to Gemini.
</p>

<div id="memoryList"></div>

<div class="addmem">

<input id="memoryInput" placeholder="Add a memory…">

<button id="addMemory">Save</button>

</div>

<div id="settingsStatus" class="status"></div>

</div>

</div>


<script>

/* =========================================================
   GEMINI MODELS
========================================================= */

/*
  Primary:
  gemini-3.5-flash-lite
  Fast / low latency

  Fallbacks:
  gemini-3.1-flash-lite
  gemini-3.5-flash
  gemini-3.6-flash
*/

const GEMINI_MODELS = [

"gemini-3.5-flash-lite",

"gemini-3.1-flash-lite",

"gemini-3.5-flash",

"gemini-3.6-flash"

];

const GEMINI_BASE =
"https://generativelanguage.googleapis.com/v1beta/models/";


/* =========================================================
   UI MODELS
========================================================= */

const MODELS = [

{
name:"Auto",
id:"auto",
description:"Fast Gemini"
},

{
name:"Gemini",
id:"gemini-3.5-flash-lite",
description:"Gemini 3.5 Flash-Lite"
}

];


/* =========================================================
   STORAGE
========================================================= */

const $ = id => document.getElementById(id);

function safeJSON(value,fallback){

try{
return value ? JSON.parse(value) : fallback;
}catch{
return fallback;
}

}

let selectedModel =
localStorage.getItem("wmetax_model") || "Auto";

let chats =
safeJSON(
localStorage.getItem("wmetax_chats"),
[]
);

let memories =
safeJSON(
localStorage.getItem("wmetax_memories"),
[]
);

let currentId =
localStorage.getItem("wmetax_current") || null;


/* =========================================================
   SAVE
========================================================= */

function save(){

localStorage.setItem(
"wmetax_chats",
JSON.stringify(chats)
);

localStorage.setItem(
"wmetax_memories",
JSON.stringify(memories)
);

if(currentId){

localStorage.setItem(
"wmetax_current",
currentId
);

}

}


function getApiKey(){

return localStorage.getItem(
"wmetax_gemini_key"
) || "";

}


/* =========================================================
   CHAT
========================================================= */

function currentChat(){

return chats.find(
chat => chat.id === currentId
);

}


function ensureChat(){

if(!currentChat()){

currentId =
crypto.randomUUID();

chats.unshift({

id:currentId,
title:"New chat",
pinned:false,
messages:[]

});

save();

}

}


/* =========================================================
   RENDER
========================================================= */

function render(){

const chat =
currentChat();

const box =
$("messages");

box.innerHTML = "";

if(!chat || chat.messages.length === 0){

box.innerHTML = `
<div class="empty">
<b>wMetax ai</b>
Ask anything.
</div>
`;

return;

}

chat.messages.forEach(message=>{

const bubble =
document.createElement("div");

bubble.className =
"bubble " +
(
message.role === "user"
? "user"
: "ai"
);

bubble.textContent =
message.content;

box.appendChild(bubble);

});

box.scrollTop =
box.scrollHeight;

}


/* =========================================================
   CHAT LIST
========================================================= */

function renderChats(){

const box =
$("chatList");

box.innerHTML = "";

[...chats]
.sort(
(a,b)=>
Number(b.pinned) -
Number(a.pinned)
)
.forEach(chat=>{

const row =
document.createElement("div");

row.className =
"chatrow";


const name =
document.createElement("div");

name.className =
"chatname";

name.textContent =
(chat.pinned ? "📌 " : "") +
chat.title;

name.onclick = ()=>{

currentId =
chat.id;

save();
render();
renderChats();

$("drawer")
.classList.add("hidden");

};


const pin =
document.createElement("button");

pin.textContent =
chat.pinned ? "📌" : "📍";

pin.title =
chat.pinned
? "Unpin chat"
: "Pin chat";

pin.onclick = ()=>{

chat.pinned =
!chat.pinned;

save();
renderChats();

};


const del =
document.createElement("button");

del.textContent = "×";

del.title =
"Delete chat";

del.onclick = ()=>{

chats =
chats.filter(
x => x.id !== chat.id
);

if(currentId === chat.id){

currentId =
chats[0]?.id || null;

}

save();

ensureChat();
render();
renderChats();

};


row.append(
name,
pin,
del
);

box.appendChild(row);

});

}


/* =========================================================
   MEMORY
========================================================= */

function renderMemories(){

const box =
$("memoryList");

box.innerHTML = "";

memories.forEach(
(memory,index)=>{

const item =
document.createElement("div");

item.className =
"memory";

item.textContent =
memory;

const del =
document.createElement("button");

del.textContent = "×";

del.title =
"Delete memory";

del.onclick = ()=>{

memories.splice(index,1);

save();
renderMemories();

};

item.appendChild(del);

box.appendChild(item);

});

}


/* =========================================================
   MODEL MENU
========================================================= */

MODELS.forEach(model=>{

const item =
document.createElement("div");

item.className =
"item";

item.innerHTML = `
<span>${model.name}</span>
<small>${model.description}</small>
`;

item.onclick = ()=>{

selectedModel =
model.name;

localStorage.setItem(
"wmetax_model",
selectedModel
);

$("modelBtn").textContent =
selectedModel + " ⌄";

$("modelMenu")
.classList.add("hidden");

};

$("modelMenu")
.appendChild(item);

});


$("modelBtn").textContent =
selectedModel + " ⌄";


$("modelBtn").onclick = ()=>{

$("modelMenu")
.classList.toggle("hidden");

};


/* =========================================================
   SETTINGS
========================================================= */

$("settings").onclick = ()=>{

$("apiKey").value =
getApiKey();

$("settingsStatus").textContent = "";

$("settingsStatus").className =
"status";

$("modal")
.classList.remove("hidden");

renderMemories();

};


$("closeModal").onclick = ()=>{

$("modal")
.classList.add("hidden");

};


$("saveKey").onclick = ()=>{

const key =
$("apiKey").value.trim();

if(!key){

$("settingsStatus").textContent =
"Enter your Gemini API key first.";

$("settingsStatus").className =
"status error";

return;

}

localStorage.setItem(
"wmetax_gemini_key",
key
);

$("settingsStatus").textContent =
"Gemini API key saved.";

$("settingsStatus").className =
"status success";

};


$("removeKey").onclick = ()=>{

localStorage.removeItem(
"wmetax_gemini_key"
);

$("apiKey").value = "";

$("settingsStatus").textContent =
"Gemini API key removed.";

$("settingsStatus").className =
"status";

};


/* =========================================================
   MEMORY
========================================================= */

$("addMemory").onclick = ()=>{

const value =
$("memoryInput")
.value
.trim();

if(!value)return;

memories.push(value);

$("memoryInput").value = "";

save();
renderMemories();

};


$("memoryInput")
.addEventListener(
"keydown",
event=>{

if(event.key === "Enter"){

event.preventDefault();

$("addMemory").click();

}

});


/* =========================================================
   CHAT CONTROLS
========================================================= */

$("chats").onclick = ()=>{

$("drawer")
.classList.remove("hidden");

renderChats();

};


$("closeDrawer").onclick = ()=>{

$("drawer")
.classList.add("hidden");

};


$("newChat").onclick = ()=>{

currentId =
crypto.randomUUID();

chats.unshift({

id:currentId,
title:"New chat",
pinned:false,
messages:[]

});

save();
render();
renderChats();

$("drawer")
.classList.add("hidden");

$("input").focus();

};


/* =========================================================
   GEMINI CONTENT
========================================================= */

function buildContents(){

const chat =
currentChat();

if(!chat)return [];

return chat.messages
.slice(-20)
.map(message=>({

role:
message.role === "assistant"
? "model"
: "user",

parts:[
{
text:message.content
}
]

}));

}


/* =========================================================
   SYSTEM INSTRUCTION
========================================================= */

function buildSystemInstruction(){

let text = `
You are wMetax ai, a helpful, accurate and professional AI assistant.

The user's preferred language is Persian unless the user explicitly asks for another language.

Answer clearly and directly.

Do not claim to have access to systems, files, accounts or information that you do not actually have.
`;

if(memories.length){

text += `
User memories:
`;

memories.forEach(memory=>{

text += "- " + memory + "\n";

});

}

return {
parts:[
{
text:text.trim()
}
]
};

}


/* =========================================================
   GEMINI REQUEST
========================================================= */

async function requestGemini(
apiKey,
model
){

const endpoint =
GEMINI_BASE +
model +
":generateContent";


const response =
await fetch(
endpoint,
{

method:"POST",

headers:{
"Content-Type":"application/json",
"x-goog-api-key":apiKey
},

body:
JSON.stringify({

systemInstruction:
buildSystemInstruction(),

contents:
buildContents(),

generationConfig:{
temperature:0.7,
maxOutputTokens:2048
}

})

}
);


let data = null;

try{

data =
await response.json();

}catch{

throw new Error(
"Gemini returned an invalid response."
);

}


if(!response.ok){

const error =
new Error(
"Gemini API " +
response.status +
": " +
(
data?.error?.message ||
"Unknown error"
)
);

error.status =
response.status;

throw error;

}


const parts =
data
?.candidates?.[0]
?.content?.parts || [];


const answer =
parts
.map(
part =>
part.text || ""
)
.join("")
.trim();


if(!answer){

throw new Error(
"Gemini returned no answer."
);

}


return answer;

}


/* =========================================================
   AUTO FALLBACK
========================================================= */

async function askGemini(apiKey){

let modelsToTry;


if(selectedModel === "Gemini"){

modelsToTry = [
"gemini-3.5-flash-lite",
"gemini-3.1-flash-lite",
"gemini-3.5-flash"
];

}else{

modelsToTry =
GEMINI_MODELS;

}


let lastError = null;


for(
let i = 0;
i < modelsToTry.length;
i++
){

const model =
modelsToTry[i];

try{

return await requestGemini(
apiKey,
model
);

}catch(error){

lastError = error;


/*
  Only retry on temporary
  server/rate-limit errors.
*/

if(
error.status !== 429 &&
error.status !== 500 &&
error.status !== 502 &&
error.status !== 503 &&
error.status !== 504
){

throw error;

}


/*
  Small delay before trying
  the next model.
*/

if(i < modelsToTry.length - 1){

await new Promise(
resolve =>
setTimeout(resolve,500)
);

}

}

}


throw lastError ||
new Error(
"All Gemini models are temporarily unavailable."
);

}


/* =========================================================
   SEND
========================================================= */

async function send(){

const input =
$("input");

const text =
input.value.trim();

if(!text)return;


const apiKey =
getApiKey();


if(!apiKey){

$("modal")
.classList.remove("hidden");

$("apiKey").focus();

$("settingsStatus").textContent =
"Enter your Gemini API Key first.";

$("settingsStatus").className =
"status error";

return;

}


ensureChat();

const chat =
currentChat();


chat.messages.push({

role:"user",
content:text

});


if(chat.title === "New chat"){

chat.title =
text.slice(0,50);

}

input.value = "";

render();
save();

$("send").disabled =
true;


const typing =
document.createElement("div");

typing.className =
"bubble ai typing";

typing.textContent =
"Thinking…";

$("messages")
.appendChild(typing);

$("messages")
.scrollTop =
$("messages").scrollHeight;


try{

const answer =
await askGemini(apiKey);


chat.messages.push({

role:"assistant",
content:answer

});

save();
render();


}catch(error){

console.error(
"wMetax Gemini:",
error
);


chat.messages.push({

role:"assistant",

content:
"خطا در اتصال به Gemini:\n\n" +
error.message

});

save();
render();

}finally{

$("send").disabled =
false;

$("input").focus();

}

}


/* =========================================================
   EVENTS
========================================================= */

$("send").onclick =
send;


$("input")
.addEventListener(
"keydown",
event=>{

if(
event.key === "Enter" &&
!event.shiftKey
){

event.preventDefault();

send();

}

});


document.addEventListener(
"click",
event=>{

if(
!event.target.closest(".model")
){

$("modelMenu")
.classList.add("hidden");

}

});


/* =========================================================
   INIT
========================================================= */

ensureChat();
render();

</script>

</body>
</html>
