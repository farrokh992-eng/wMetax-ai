<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050507">
<title>wMetax ai</title>

<style>
*{
  box-sizing:border-box
}

html,body{
  margin:0;
  height:100%;
  background:#050507;
  color:#f4f4f6;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}

body{
  overflow:hidden
}

button,input,textarea{
  font:inherit
}

.app{
  height:100dvh;
  max-width:900px;
  margin:auto;
  display:flex;
  flex-direction:column
}

/* TOP */

.top{
  height:62px;
  display:flex;
  align-items:center;
  padding:0 16px
}

.brand{
  display:flex;
  align-items:center;
  gap:10px
}

.brand img{
  width:36px;
  height:36px;
  border-radius:10px;
  object-fit:cover
}

.logo{
  font-size:25px;
  font-weight:750;
  direction:ltr
}

.logo span{
  font-weight:450;
  color:#8d8e96
}

.actions{
  margin-right:auto;
  display:flex;
  gap:5px;
  direction:ltr
}

.icon{
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  background:#15161b;
  color:#ddd;
  font-size:20px;
  cursor:pointer
}

/* MODEL */

.modelbar{
  display:flex;
  justify-content:center;
  padding:2px 16px 8px
}

.model{
  position:relative
}

.model>button{
  border:0;
  background:#17181d;
  color:#eee;
  border-radius:14px;
  padding:10px 15px;
  font-size:15px;
  min-width:160px;
  cursor:pointer
}

.menu{
  position:absolute;
  top:48px;
  left:50%;
  transform:translateX(-50%);
  width:250px;
  background:#17181d;
  border:1px solid #292a31;
  border-radius:16px;
  padding:7px;
  z-index:30;
  box-shadow:0 18px 50px #0009
}

.hidden{
  display:none!important
}

.item{
  padding:11px 12px;
  border-radius:11px;
  cursor:pointer;
  display:flex;
  justify-content:space-between;
  direction:rtl
}

.item:hover{
  background:#24252b
}

.item small{
  color:#85858d
}

/* MESSAGES */

.messages{
  flex:1;
  overflow:auto;
  padding:10px 16px 120px;
  display:flex;
  flex-direction:column;
  gap:10px;
  direction:rtl
}

.empty{
  margin:auto;
  text-align:center;
  color:#8c8d95
}

.empty b{
  display:block;
  color:#eee;
  font-size:28px;
  margin-bottom:8px;
  direction:ltr
}

.bubble{
  max-width:82%;
  padding:12px 14px;
  border-radius:17px;
  line-height:1.75;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  text-align:right
}

.user{
  align-self:flex-start;
  background:#2a2c34
}

.ai{
  align-self:flex-end;
  background:#15161b
}

.typing{
  opacity:.65
}

/* COMPOSER */

.composer{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:min(900px,100%);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(transparent,#050507 25%);
  display:flex;
  gap:8px;
  direction:ltr
}

.input{
  flex:1;
  min-height:52px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  border-radius:18px;
  background:#17181d;
  color:#fff;
  padding:15px;
  direction:rtl;
  text-align:right
}

.send{
  width:52px;
  height:52px;
  border:0;
  border-radius:17px;
  background:#f1f1f3;
  color:#08080a;
  font-size:22px;
  cursor:pointer
}

.send:disabled{
  opacity:.5;
  cursor:default
}

/* DRAWER / MODAL */

.drawer,
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50
}

.panel{
  height:100%;
  width:min(350px,88%);
  background:#101116;
  padding:20px;
  box-shadow:20px 0 60px #0008;
  overflow:auto
}

.drawer .panel{
  margin-right:0;
  margin-left:auto
}

.modal .panel{
  height:auto;
  max-height:85%;
  margin:8vh auto;
  border-radius:20px;
  width:min(440px,92%)
}

.close{
  float:left
}

/* CHATS */

.chatrow{
  padding:12px;
  border-radius:12px;
  background:#18191f;
  margin-bottom:8px;
  display:flex;
  gap:8px;
  align-items:center;
  direction:ltr
}

.chatrow button{
  background:none;
  border:0;
  color:#bbb;
  cursor:pointer;
  font-size:18px
}

.chatname{
  flex:1;
  cursor:pointer;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  direction:rtl;
  text-align:right
}

/* MEMORY */

.memory{
  padding:12px;
  border-radius:12px;
  background:#18191f;
  margin:8px 0;
  overflow:hidden
}

.memory button{
  float:left;
  background:none;
  border:0;
  color:#aaa;
  cursor:pointer
}

.addmem{
  display:flex;
  gap:8px;
  margin-top:12px
}

.addmem input{
  flex:1;
  background:#18191f;
  color:#fff;
  border:1px solid #292a31;
  border-radius:10px;
  padding:10px;
  direction:rtl
}

.addmem button,
.primary{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer
}

/* SETTINGS */

.field{
  margin:18px 0
}

.field label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:7px
}

.field input{
  width:100%;
  background:#18191f;
  color:#fff;
  border:1px solid #292a31;
  border-radius:11px;
  padding:12px;
  outline:none;
  direction:ltr
}

.help{
  color:#777;
  font-size:12px;
  line-height:1.7
}

.status{
  min-height:20px;
  margin-top:10px;
  font-size:12px;
  line-height:1.6
}

.success{
  color:#9ee6ae
}

.error{
  color:#ff9da3
}

.warning{
  color:#ffd58a
}
</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="brand">
    <img src="./assets/wmetax_logo.png" alt="wMetax ai">
    <div class="logo">wMetax <span>ai</span></div>
  </div>

  <div class="actions">
    <button class="icon" id="chats" title="Chats">☰</button>
    <button class="icon" id="settings" title="Settings">⚙</button>
  </div>

</header>


<!-- MODEL -->

<div class="modelbar">

  <div class="model">

    <button id="modelBtn">Auto ⌄</button>

    <div class="menu hidden" id="modelMenu"></div>

  </div>

</div>


<!-- MESSAGES -->

<main class="messages" id="messages"></main>


<!-- COMPOSER -->

<div class="composer">

  <textarea
    id="input"
    class="input"
    rows="1"
    placeholder="هر چیزی بپرسید…"
    autocomplete="off"
  ></textarea>

  <button id="send" class="send">➤</button>

</div>

</div>


<!-- CHAT DRAWER -->

<div class="drawer hidden" id="drawer">

  <div class="panel">

    <button class="icon close" id="closeDrawer">×</button>

    <h2>Chats</h2>

    <div class="item" id="newChat">
      ＋ چت جدید
    </div>

    <div id="chatList"></div>

  </div>

</div>


<!-- SETTINGS -->

<div class="modal hidden" id="modal">

  <div class="panel">

    <button class="icon close" id="closeModal">×</button>

    <h2>Settings</h2>

    <div class="field">

      <label>Gemini API Key</label>

      <input
        id="apiKey"
        type="password"
        placeholder="Gemini API Key"
        autocomplete="off"
      >

    </div>

    <button class="primary" id="saveKey">
      ذخیره کلید
    </button>

    <button class="primary danger" id="removeKey">
      حذف کلید
    </button>

    <p class="help">
      کلید فقط در localStorage همین مرورگر ذخیره می‌شود.
      این روش فقط برای دمو و استفاده شخصی مناسب است.
    </p>

    <hr style="border-color:#24252b;margin:22px 0">

    <h3>Memory</h3>

    <p class="help">
      اطلاعات Memory در همین مرورگر ذخیره شده و همراه پیام‌ها
      به Gemini ارسال می‌شود.
    </p>

    <div id="memoryList"></div>

    <div class="addmem">

      <input
        id="memoryInput"
        placeholder="یک Memory اضافه کنید…"
      >

      <button id="addMemory">
        ذخیره
      </button>

    </div>

    <div id="settingsStatus" class="status"></div>

  </div>

</div>


<script>

/* =========================================================
   GEMINI CONFIG
========================================================= */

/*
  مدل اصلی رسمی فعلی برای این دمو.
  اگر موقتاً 503/429 بدهد، نسخه پایین retry می‌کند.
*/

const GEMINI_MODEL = "gemini-3.6-flash";

const GEMINI_ENDPOINT =
  "https://generativelanguage.googleapis.com/v1beta/models/" +
  GEMINI_MODEL +
  ":generateContent";


/* =========================================================
   UI
========================================================= */

const $ = id => document.getElementById(id);


/* =========================================================
   LOCAL STORAGE
========================================================= */

function safeJSON(value, fallback){

  try{

    return value
      ? JSON.parse(value)
      : fallback;

  }catch{

    return fallback;

  }

}


let chats =
  safeJSON(
    localStorage.getItem("wmetax_chats"),
    []
  );


let memories =
  safeJSON(
    localStorage.getItem("wmetax_memories"),
    []
  );


let currentId =
  localStorage.getItem("wmetax_current") ||
  null;


let selectedModel =
  localStorage.getItem("wmetax_model") ||
  "Auto";


/* =========================================================
   SAVE
========================================================= */

function save(){

  localStorage.setItem(
    "wmetax_chats",
    JSON.stringify(chats)
  );

  localStorage.setItem(
    "wmetax_memories",
    JSON.stringify(memories)
  );

  if(currentId){

    localStorage.setItem(
      "wmetax_current",
      currentId
    );

  }

}


function getApiKey(){

  return (
    localStorage.getItem(
      "wmetax_gemini_key"
    ) || ""
  );

}


/* =========================================================
   CHAT
========================================================= */

function currentChat(){

  return chats.find(
    chat => chat.id === currentId
  );

}


function ensureChat(){

  if(!currentChat()){

    currentId =
      crypto.randomUUID();

    chats.unshift({

      id:currentId,

      title:"New chat",

      pinned:false,

      messages:[]

    });

    save();

  }

}


/* =========================================================
   RENDER CHAT
========================================================= */

function render(){

  const chat =
    currentChat();

  const box =
    $("messages");

  box.innerHTML = "";

  if(
    !chat ||
    chat.messages.length === 0
  ){

    box.innerHTML = `
      <div class="empty">
        <b>wMetax ai</b>
        هر چیزی بپرسید.
      </div>
    `;

    return;

  }


  chat.messages.forEach(
    message => {

      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble " +
        (
          message.role === "user"
            ? "user"
            : "ai"
        );

      bubble.textContent =
        message.content;

      box.appendChild(bubble);

    }
  );


  box.scrollTop =
    box.scrollHeight;

}


/* =========================================================
   CHAT LIST
========================================================= */

function renderChats(){

  const box =
    $("chatList");

  box.innerHTML = "";


  [...chats]
    .sort(
      (a,b) =>
        Number(b.pinned) -
        Number(a.pinned)
    )
    .forEach(
      chat => {

        const row =
          document.createElement("div");

        row.className =
          "chatrow";


        const name =
          document.createElement("div");

        name.className =
          "chatname";

        name.textContent =
          (
            chat.pinned
              ? "📌 "
              : ""
          ) +
          chat.title;


        name.onclick = () => {

          currentId =
            chat.id;

          save();

          render();

          renderChats();

          $("drawer")
            .classList
            .add("hidden");

        };


        const pin =
          document.createElement("button");

        pin.textContent =
          chat.pinned
            ? "📌"
            : "📍";


        pin.onclick = () => {

          chat.pinned =
            !chat.pinned;

          save();

          renderChats();

        };


        const del =
          document.createElement("button");

        del.textContent =
          "×";


        del.onclick = () => {

          chats =
            chats.filter(
              x =>
                x.id !== chat.id
            );


          if(
            currentId ===
            chat.id
          ){

            currentId =
              chats[0]?.id ||
              null;

          }


          save();

          ensureChat();

          render();

          renderChats();

        };


        row.append(
          name,
          pin,
          del
        );


        box.appendChild(row);

      }
    );

}


/* =========================================================
   MEMORY
========================================================= */

function renderMemories(){

  const box =
    $("memoryList");

  box.innerHTML = "";


  memories.forEach(
    (memory,index) => {

      const item =
        document.createElement("div");

      item.className =
        "memory";

      item.textContent =
        memory;


      const del =
        document.createElement("button");

      del.textContent =
        "×";


      del.onclick = () => {

        memories.splice(
          index,
          1
        );

        save();

        renderMemories();

      };


      item.appendChild(del);

      box.appendChild(item);

    }
  );

}


/* =========================================================
   MODEL MENU
========================================================= */

const modelItem =
  document.createElement("div");

modelItem.className =
  "item";

modelItem.innerHTML = `
  <span>Auto</span>
  <small>Gemini 3.6 Flash</small>
`;


modelItem.onclick = () => {

  selectedModel =
    "Auto";

  localStorage.setItem(
    "wmetax_model",
    "Auto"
  );

  $("modelBtn").textContent =
    "Auto ⌄";

  $("modelMenu")
    .classList
    .add("hidden");

};


$("modelMenu")
  .appendChild(modelItem);


const fixedModel =
  document.createElement("div");

fixedModel.className =
  "item";

fixedModel.innerHTML = `
  <span>Gemini</span>
  <small>3.6 Flash</small>
`;


fixedModel.onclick = () => {

  selectedModel =
    "Gemini";

  localStorage.setItem(
    "wmetax_model",
    "Gemini"
  );

  $("modelBtn").textContent =
    "Gemini ⌄";

  $("modelMenu")
    .classList
    .add("hidden");

};


$("modelMenu")
  .appendChild(fixedModel);


$("modelBtn").textContent =
  selectedModel +
  " ⌄";


$("modelBtn").onclick = () => {

  $("modelMenu")
    .classList
    .toggle("hidden");

};


/* =========================================================
   SETTINGS
========================================================= */

$("settings").onclick = () => {

  $("apiKey").value =
    getApiKey();

  $("settingsStatus").textContent =
    "";

  $("settingsStatus").className =
    "status";

  $("modal")
    .classList
    .remove("hidden");

  renderMemories();

};


$("closeModal").onclick = () => {

  $("modal")
    .classList
    .add("hidden");

};


$("saveKey").onclick = () => {

  const key =
    $("apiKey")
      .value
      .trim();


  if(!key){

    $("settingsStatus")
      .textContent =
      "کلید Gemini را وارد کنید.";

    $("settingsStatus")
      .className =
      "status error";

    return;

  }


  localStorage.setItem(
    "wmetax_gemini_key",
    key
  );


  $("settingsStatus")
    .textContent =
    "کلید Gemini ذخیره شد.";

  $("settingsStatus")
    .className =
    "status success";

};


$("removeKey").onclick = () => {

  localStorage.removeItem(
    "wmetax_gemini_key"
  );

  $("apiKey").value =
    "";

  $("settingsStatus")
    .textContent =
    "کلید حذف شد.";

  $("settingsStatus")
    .className =
    "status";

};


/* =========================================================
   MEMORY EVENTS
========================================================= */

$("addMemory").onclick = () => {

  const value =
    $("memoryInput")
      .value
      .trim();


  if(!value)
    return;


  memories.push(value);

  $("memoryInput").value =
    "";

  save();

  renderMemories();

};


$("memoryInput")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        $("addMemory")
          .click();

      }

    }
  );


/* =========================================================
   CHAT EVENTS
========================================================= */

$("chats").onclick = () => {

  $("drawer")
    .classList
    .remove("hidden");

  renderChats();

};


$("closeDrawer").onclick = () => {

  $("drawer")
    .classList
    .add("hidden");

};


$("newChat").onclick = () => {

  currentId =
    crypto.randomUUID();

  chats.unshift({

    id:currentId,

    title:"New chat",

    pinned:false,

    messages:[]

  });

  save();

  render();

  renderChats();

  $("drawer")
    .classList
    .add("hidden");

  $("input").focus();

};


/* =========================================================
   BUILD GEMINI HISTORY
========================================================= */

function buildContents(){

  const chat =
    currentChat();


  if(!chat)
    return [];


  /*
    فقط آخرین 20 پیام برای سرعت
    و کاهش مصرف ارسال می‌شود.
  */

  return chat.messages
    .slice(-20)
    .map(
      message => ({

        role:
          message.role ===
          "assistant"
            ? "model"
            : "user",

        parts:[
          {
            text:
              message.content
          }
        ]

      })
    );

}


/* =========================================================
   SYSTEM INSTRUCTION
========================================================= */

function buildSystemInstruction(){

  let instruction = `
You are wMetax ai.

You are a helpful, accurate and professional AI assistant.

The user prefers Persian by default.

Answer in Persian unless the user explicitly requests another language.

Be direct, useful and concise.

Do not claim access to files, accounts, systems or information that you do not actually have.
`;


  if(memories.length){

    instruction +=
      "\n\nUser memories:\n";


    memories.forEach(
      memory => {

        instruction +=
          "- " +
          memory +
          "\n";

      }
    );

  }


  return instruction.trim();

}


/* =========================================================
   LOW LEVEL GEMINI REQUEST
========================================================= */

async function geminiRequest(
  apiKey,
  attempt = 0
){

  const response =
    await fetch(
      GEMINI_ENDPOINT,
      {

        method:"POST",

        headers:{
          "Content-Type":
            "application/json",

          "x-goog-api-key":
            apiKey
        },

        body:
          JSON.stringify({

            systemInstruction:{
              parts:[
                {
                  text:
                    buildSystemInstruction()
                }
              ]
            },

            contents:
              buildContents(),

            generationConfig:{

              temperature:0.7,

              maxOutputTokens:2048

            }

          })

      }
    );


  let data;


  try{

    data =
      await response.json();

  }catch{

    throw new Error(
      "پاسخ نامعتبر از Gemini دریافت شد."
    );

  }


  if(response.ok){

    const parts =
      data
        ?.candidates?.[0]
        ?.content?.parts || [];


    const answer =
      parts
        .map(
          part =>
            part.text || ""
        )
        .join("")
        .trim();


    if(!answer){

      throw new Error(
        "Gemini پاسخی برنگرداند."
      );

    }


    return answer;

  }


  const status =
    response.status;


  const message =
    data
      ?.error
      ?.message ||
    "Unknown Gemini error";


  /*
    Temporary server errors.
    Retry with exponential backoff.
  */

  if(
    (
      status === 429 ||
      status === 500 ||
      status === 502 ||
      status === 503 ||
      status === 504
    ) &&
    attempt < 3
  ){

    const delay =
      900 *
      Math.pow(
        2,
        attempt
      ) +
      Math.random() * 500;


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          delay
        )
    );


    return geminiRequest(
      apiKey,
      attempt + 1
    );

  }


  throw new Error(
    "Gemini API " +
    status +
    ": " +
    message
  );

}


/* =========================================================
   GEMINI CONNECTION
========================================================= */

async function askGemini(apiKey){

  /*
    برای Auto و Gemini هر دو
    از مدل واقعی رسمی استفاده می‌کنیم.
  */

  return await geminiRequest(
    apiKey
  );

}


/* =========================================================
   SEND
========================================================= */

async function send(){

  const input =
    $("input");


  const text =
    input
      .value
      .trim();


  if(!text)
    return;


  const apiKey =
    getApiKey();


  if(!apiKey){

    $("modal")
      .classList
      .remove("hidden");

    $("apiKey").focus();

    $("settingsStatus")
      .textContent =
      "ابتدا Gemini API Key را وارد کنید.";

    $("settingsStatus")
      .className =
      "status error";

    return;

  }


  ensureChat();


  const chat =
    currentChat();


  chat.messages.push({

    role:"user",

    content:text

  });


  if(
    chat.title ===
    "New chat"
  ){

    chat.title =
      text.slice(0,50);

  }


  input.value =
    "";

  render();

  save();


  $("send")
    .disabled =
    true;


  const typing =
    document.createElement("div");

  typing.className =
    "bubble ai typing";

  typing.textContent =
    "در حال فکر کردن…";


  $("messages")
    .appendChild(typing);


  $("messages")
    .scrollTop =
    $("messages")
    .scrollHeight;


  try{

    const answer =
      await askGemini(
        apiKey
      );


    chat.messages.push({

      role:"assistant",

      content:answer

    });


    save();

    render();


  }catch(error){

    console.error(
      "wMetax Gemini:",
      error
    );


    let message =
      error?.message ||
      "خطای ناشناخته";


    /*
      Failed to fetch means the browser
      did not receive an HTTP response.
    */

    if(
      message ===
      "Failed to fetch"
    ){

      message =
        "مرورگر نتوانست به سرور Gemini وصل شود.\n\n" +
        "احتمالاً اتصال شبکه، VPN/Proxy، افزونه مرورگر یا محدودیت دسترسی به Google API باعث این خطا شده است.\n\n" +
        "اگر سایت با HTTPS باز شده، صفحه را یک‌بار Refresh کنید و دوباره امتحان کنید.";

    }


    chat.messages.push({

      role:"assistant",

      content:
        "خطا در اتصال به Gemini:\n\n" +
        message

    });


    save();

    render();


  }finally{

    $("send")
      .disabled =
      false;

    $("input")
      .focus();

  }

}


/* =========================================================
   SEND EVENTS
========================================================= */

$("send").onclick =
  send;


$("input")
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter" &&
        !event.shiftKey
      ){

        event.preventDefault();

        send();

      }

    }
  );


/* =========================================================
   CLOSE MODEL MENU
========================================================= */

document.addEventListener(
  "click",
  event => {

    if(
      !event.target.closest(
        ".model"
      )
    ){

      $("modelMenu")
        .classList
        .add("hidden");

    }

  }
);


/* =========================================================
   INIT
========================================================= */

ensureChat();

render();

</script>

</body>
</html>
